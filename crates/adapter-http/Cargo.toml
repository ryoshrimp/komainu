tokio = { workspace = true, features = ["net"] }
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
