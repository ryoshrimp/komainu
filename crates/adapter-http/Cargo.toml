[package]
name = "komainu-adapter-http"
description = "SSRF-safe JWKS fetcher adapter for komainu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["oauth2", "jwks", "ssrf", "authentication"]
