[package]
name = "komainu-jose-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
komainu-jose = { path = ".." }
time = "0.3"
serde_json = "1"

[[bin]]
name = "jws_verify"
path = "fuzz_targets/jws_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_decode"
path = "fuzz_targets/jwt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwk_parse"
path = "fuzz_targets/jwk_parse.rs"
test = false
doc = false
bench = false

[workspace]
