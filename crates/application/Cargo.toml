[package]
name = "komainu-application"
description = "Use cases and ports of the komainu OAuth 2.0 authorization server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["oauth2", "oauth", "authorization-server", "pkce", "authentication"]
categories = ["authentication"]

[dependencies]
komainu-domain.workspace = true
komainu-jose.workspace = true
time = { workspace = true, features = ["formatting"] }
serde.workspace = true
uuid.workspace = true
base64.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path only: dev-dependencies without a version are dropped when packaging, which breaks the
# application <-> testkit cycle.
komainu-testkit = { path = "../testkit" }

[lints]
workspace = true
