<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f5f5f5; color: #222; }
main { max-width: 24rem; margin: 2rem auto; padding: 1.5rem; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
h1 { font-size: 1.25rem; margin-top: 0; }
label { display: block; margin-top: 1rem; }
input[type=text], input[type=password] { box-sizing: border-box; width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
button { margin-top: 1.5rem; margin-right: 0.5rem; padding: 0.5rem 1rem; }
.error { color: #b00020; }
</style>
</head>
<body>
<main>

<h1>Sign in to continue to Example &#60;App&#62;</h1>

<form method="post" action="https://auth.example.com/login">
<input type="hidden" name="request_id" value="req-1">
<input type="hidden" name="csrf_token" value="csrf-1">
<label>Username
<input type="text" name="username" value="" autocomplete="username" required>
</label>
<label>Password
<input type="password" name="password" autocomplete="current-password" required>
</label>
<button type="submit">Sign in</button>
</form>

</main>
</body>
</html>
