[workspace]
resolver = "3"
members = [
    "crates/jose",
    "crates/domain",
    "crates/application",
    "crates/adapter-postgres",
    "crates/adapter-std",
    "crates/adapter-http",
    "crates/testkit",
    "crates/http",
    "crates/komainu",
    "crates/server",
]
exclude = ["crates/jose/fuzz"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryoshrimp/komainu"

[workspace.dependencies]
# Internal crates
komainu-jose = { path = "crates/jose", version = "0.1.0-alpha.3" }
komainu-domain = { path = "crates/domain", version = "0.1.0-alpha.3" }
komainu-application = { path = "crates/application", version = "0.1.0-alpha.3" }
komainu-adapter-postgres = { path = "crates/adapter-postgres", version = "0.1.0-alpha.3" }
komainu-adapter-std = { path = "crates/adapter-std", version = "0.1.0-alpha.3" }
komainu-adapter-http = { path = "crates/adapter-http", version = "0.1.0-alpha.3" }
komainu-testkit = { path = "crates/testkit", version = "0.1.0-alpha.3" }
komainu-http = { path = "crates/http", version = "0.1.0-alpha.3" }
komainu = { path = "crates/komainu", version = "0.1.0-alpha.3" }

# DDD building blocks (only komainu-domain and komainu-jose depend on it)
ddd-toolkit = { version = "0.5", default-features = false }

# Web
axum = { version = "0.8", features = ["form", "query"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "limit"] }
askama = "0.16"
http-body-util = "0.1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "json", "migrate"] }

# Crypto and randomness
argon2 = "0.6"
sha2 = "0.11"
rand = "0.10"
subtle = "2"
base64 = "0.23"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
p256 = "0.14"
pkcs8 = { version = "0.11", features = ["pem", "std"] }
zeroize = "1"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }

# Data types
time = "0.3"
uuid = "1"
url = "2"
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Runtime, CLI, configuration
tokio = "1"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Errors
thiserror = "2"
anyhow = "1"

# Test-only
testcontainers-modules = { version = "0.15", features = ["postgres"] }
assert_cmd = "2"
proptest = "1"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# RSA key generation and signing are very slow unoptimized.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3
