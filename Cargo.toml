[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
ddd-toolkit = { version = "0.4", features = ["serde", "serde_with"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
url = "2"